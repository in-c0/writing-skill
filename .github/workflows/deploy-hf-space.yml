name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "CHECKLIST.md"
      - "demo/**"
      - ".github/workflows/deploy-hf-space.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing repository secret: HF_TOKEN" >&2
            exit 1
          fi
          if [ -z "$HF_SPACE_REPO" ]; then
            echo "Missing repository variable: HF_SPACE_REPO" >&2
            exit 1
          fi

      - name: Install deploy dependency
        run: pip install "huggingface_hub>=0.27,<2"

      - name: Create or update Space
        run: python demo/deploy_to_hf.py
