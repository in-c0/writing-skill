name: Ingest human review

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest-human-review
  cancel-in-progress: false

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[human-review]')
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SITE_REPO: ${{ vars.HF_SITE_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse review from issue body
        id: parse
        env:
          BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
          NUM: ${{ github.event.issue.number }}
        run: python benchmark/tools/ingest_review.py
      - name: Re-aggregate and commit
        if: steps.parse.outputs.ok == 'true'
        run: |
          python benchmark/tools/aggregate.py
          git config user.name "writing-skill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/human-reviews benchmark/results.json README.md benchmark/BENCHMARK.md
          git commit -m "bench: add human review from #${{ github.event.issue.number }} (@${{ github.event.issue.user.login }})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Redeploy site
        if: steps.parse.outputs.ok == 'true' && env.HF_TOKEN != ''
        run: |
          pip install "huggingface_hub>=0.27,<2"
          python scripts/build_site.py
          python scripts/deploy_site_to_hf.py
      - name: Reply and close
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.parse.outputs.ok }}' === 'true';
            const body = ok
              ? 'Thanks! Your picks are in the leaderboard now: https://github.com/${{ github.repository }}#benchmark'
              : 'I could not find a valid ```json block with picks in this issue. Run the judging rounds on the site and use its "Send to leaderboard" button.';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            if (ok) await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
